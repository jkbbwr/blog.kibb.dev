<!doctype html>
<html lang="{{ config.default_language | default(value='en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff5e3a'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23ff5e3a' stroke-opacity='.35' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/neon.css">
  {%- if config.generate_feeds %}
    {%- for feed in config.feed_filenames %}
      <link rel="alternate" type="application/atom+xml" title="{{ config.title }} Feed" href="{{ get_url(path=feed, trailing_slash=false) }}" />
    {%- endfor %}
  {%- endif %}
</head>
<body>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-in">
      <a href="/" class="mark"><span>blog.kibb<b>.dev</b></span><span class="mark-dot"></span></a>
      <div class="nav-links">
        <a href="/blog/">/blog</a>
        <a href="/tags/">/tags</a>
        {%- if config.extra.github %}
          <a href="{{ config.extra.github }}" class="gh ext" target="_blank" rel="noopener">github ↗</a>
        {%- endif %}
      </div>
    </div>
  </nav>

  {% block header %}{% endblock header %}

  <main>
    <div class="wrap">
      {% block content %}{% endblock content %}
    </div>
  </main>

  <footer>
    <div class="wrap foot-in">
      <div class="foot-mark">blog.kibb.dev</div>
      <div class="colophon">
        <a href="{{ config.extra.github | default(value='https://github.com/jkbbwr') }}" target="_blank" rel="noopener">github.com/jkbbwr</a>
      </div>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.prose pre, main pre').forEach(function (pre) {
      if (pre.closest('.editor')) return;
      var code = pre.querySelector('code');
      var lang = code && code.getAttribute('data-lang') ? code.getAttribute('data-lang') : 'code';
      
      var editor = document.createElement('div');
      editor.className = 'editor';
      
      var topBar = document.createElement('div');
      topBar.className = 'editor-top';
      topBar.innerHTML = '<div class="dots"><i></i><i></i><i></i></div><span class="tab-title">' + lang + '</span><button class="copy-btn" type="button" aria-label="Copy code">Copy</button>';
      
      var copyBtn = topBar.querySelector('.copy-btn');
      copyBtn.addEventListener('click', function () {
        var text = (code ? code.innerText : pre.innerText).trimEnd();
        navigator.clipboard.writeText(text).then(function () {
          copyBtn.textContent = 'Copied';
          copyBtn.classList.add('copied');
          setTimeout(function () {
            copyBtn.textContent = 'Copy';
            copyBtn.classList.remove('copied');
          }, 1600);
        });
      });
      
      pre.parentNode.insertBefore(editor, pre);
      editor.appendChild(topBar);
      editor.appendChild(pre);
    });
  </script>

</body>
</html>
